name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:visual -- --update-snapshots
      - name: Commit baselines
        run: |
          # Authored as whoever ran the workflow, so the repo's contributors stay its real authors.
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots
          git diff --cached --quiet || git commit -m "test: update visual regression baselines"
          git push
